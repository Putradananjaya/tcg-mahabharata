<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="sky" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#2d2356"/>
      <stop offset="1" stop-color="#0d0b1f"/>
    </radialGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="12" y1="10" x2="52" y2="54">
      <stop offset="0" stop-color="#f6dc9a"/>
      <stop offset="0.5" stop-color="#e8b54a"/>
      <stop offset="1" stop-color="#b07d1a"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#sky)"/>
  <!-- Gerigi Sudarshana chakra: 12 gigi segitiga di luar pelek -->
  <g fill="url(#gold)">
    <path id="tooth" d="M29.6 9.4 L32 4 L34.4 9.4 Z"/>
    <use href="#tooth" transform="rotate(30 32 32)"/>
    <use href="#tooth" transform="rotate(60 32 32)"/>
    <use href="#tooth" transform="rotate(90 32 32)"/>
    <use href="#tooth" transform="rotate(120 32 32)"/>
    <use href="#tooth" transform="rotate(150 32 32)"/>
    <use href="#tooth" transform="rotate(180 32 32)"/>
    <use href="#tooth" transform="rotate(210 32 32)"/>
    <use href="#tooth" transform="rotate(240 32 32)"/>
    <use href="#tooth" transform="rotate(270 32 32)"/>
    <use href="#tooth" transform="rotate(300 32 32)"/>
    <use href="#tooth" transform="rotate(330 32 32)"/>
  </g>
  <!-- Pelek dan 8 jari-jari -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#gold)" stroke-width="5"/>
  <g stroke="url(#gold)" stroke-width="3.2" stroke-linecap="round">
    <line x1="32" y1="14" x2="32" y2="50"/>
    <line x1="14" y1="32" x2="50" y2="32"/>
    <line x1="19.3" y1="19.3" x2="44.7" y2="44.7"/>
    <line x1="44.7" y1="19.3" x2="19.3" y2="44.7"/>
  </g>
  <!-- Poros -->
  <circle cx="32" cy="32" r="6.5" fill="url(#gold)"/>
  <circle cx="32" cy="32" r="2.4" fill="#0d0b1f"/>
</svg>
