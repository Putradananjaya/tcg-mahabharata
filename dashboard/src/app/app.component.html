<div class="dashboard-container">
  <!-- Header -->
  <header class="dashboard-header">
    <div class="logo-area">
      <span class="logo-icon">⚔️</span>
      <div class="logo-text">
        <h1>Mahabharata TCG</h1>
        <p>AI Balancing & Research Suite</p>
      </div>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="dashboard-layout" [class.nav-collapsed]="navCollapsed">
    <!-- Navigation Sidebar -->
    <nav class="dashboard-nav glass-card" aria-label="Navigasi utama">
      <button type="button" class="nav-toggle" (click)="toggleNav()"
              [attr.aria-expanded]="!navCollapsed"
              [attr.aria-label]="navCollapsed ? 'Perluas sidebar' : 'Ciutkan sidebar'"
              [attr.title]="navCollapsed ? 'Perluas sidebar' : 'Ciutkan sidebar'">
        <svg class="toggle-chevron" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="btn-label">Ciutkan</span>
      </button>
      <button *ngFor="let item of navItems" [routerLink]="item.path" routerLinkActive="active" class="nav-btn"
              [attr.title]="navCollapsed ? item.label : null" [attr.aria-label]="item.label">
        <span class="btn-icon">{{ item.icon }}</span>
        <span class="btn-label">{{ item.label }}</span>
      </button>
    </nav>

    <!-- Main Content Area -->
    <main class="dashboard-main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
